name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          # The passive data connection times out over plain FTP; try FTPS (TLS) in case the
          # host now requires secure FTP. Falls back cleanly if the host doesn't support it.
          protocol: ftps
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            README.md
            .gitignore
